<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>Contact Us | BidURS</title>
  <meta name="description" content="Get in touch with BidURS's support team for auction inquiries, payment help, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../assets/images/favicon.png" alt="BIDURS Logo">
        BIDURS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto"></ul>
        <div class="d-flex gap-2"></div>
      </div>
    </div>
  </nav>

  <!-- ══ PAGE HERO ══ -->
  <div class="page-hero">
    <div class="container text-center position-relative z-1">
      <h1 class="hero-title mb-3">Contact <span>Us</span></h1>
      <div style="width:56px;height:4px;background:var(--grad-orange);border-radius:999px;margin:0 auto 1.5rem;box-shadow:var(--glow-orange);"></div>
      <p class="hero-subtitle mx-auto" style="font-size:1rem;">We're here to help with your auction inquiries.</p>
    </div>
  </div>

  <section class="section-padding">
    <div class="container">
      <div class="row g-5 justify-content-center">

        <!-- Contact Info -->
        <div class="col-lg-4">
          <div class="glass p-4 mb-4" style="border-radius:var(--radius-lg);">
            <h4 class="fw-bold text-navy mb-4" style="font-family:var(--font-heading);">Get in Touch</h4>

            <div class="contact-info-row d-flex align-items-start mb-4">
              <div class="contact-icon-box me-3" style="width:44px;height:44px;background:rgba(0,102,255,0.12);border:1px solid var(--glass-border-blue);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="bi bi-geo-alt-fill" style="color:var(--royal-blue);font-size:1.2rem;"></i>
              </div>
              <div>
                <h6 class="fw-bold text-navy mb-1">Office Location</h6>
                <p class="small mb-0" style="color:var(--text-body);font-weight:450;">BIDURS Headquarters<br>Mumbai, Maharashtra, India</p>
              </div>
            </div>

            <div class="contact-info-row d-flex align-items-start mb-4">
              <div class="contact-icon-box me-3" style="width:44px;height:44px;background:rgba(212,175,55,0.15);border:1px solid var(--glass-border-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="bi bi-envelope-fill" style="color:var(--gold-dark);font-size:1.2rem;"></i>
              </div>
              <div>
                <h6 class="fw-bold text-navy mb-1">Email Support</h6>
                <p class="small mb-0" style="color:var(--text-body);font-weight:450;">support@bidurs.in</p>
              </div>
            </div>

            <div class="contact-info-row d-flex align-items-start mb-2">
              <div class="contact-icon-box me-3" style="width:44px;height:44px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="bi bi-telephone-fill" style="color:var(--success);font-size:1.2rem;"></i>
              </div>
              <div>
                <h6 class="fw-bold text-navy mb-1">Phone Number</h6>
                <p class="small mb-0" style="color:var(--text-body);font-weight:450;">+91 98765 43210</p>
              </div>
            </div>
          </div>

          <!-- Social -->
          <div class="glass p-4" style="border-radius:var(--radius-lg);">
            <h6 class="fw-bold text-navy mb-3">Follow Us</h6>
            <div class="footer-social d-flex gap-2 flex-wrap">
              <a href="#" title="Facebook"><i class="bi bi-facebook"></i></a>
              <a href="#" title="Twitter"><i class="bi bi-twitter-x"></i></a>
              <a href="#" title="Instagram"><i class="bi bi-instagram"></i></a>
              <a href="#" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
              <a href="#" title="YouTube"><i class="bi bi-youtube"></i></a>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="col-lg-7">
          <div class="glass p-4 p-md-5">
            <h4 class="fw-bold text-navy mb-4" style="font-family:var(--font-heading);">Send a Message</h4>
            <form id="contact-form">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="contactName" placeholder="John Doe" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Mobile Number</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                    <input type="tel" class="form-control" id="contactPhone" placeholder="+91 98765 43210" required>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="contactEmail" placeholder="your@email.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Subject</label>
                <select class="form-select" id="contactSubject" required>
                  <option value="" selected disabled>Select a subject</option>
                  <option value="General Inquiry">General Inquiry</option>
                  <option value="Payment Issue">Payment Issue</option>
                  <option value="Auction Dispute">Auction Dispute</option>
                  <option value="Subscription Help">Subscription Help</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="form-label">Your Message</label>
                <textarea class="form-control" id="contactMessage" rows="5" placeholder="Describe your inquiry in detail..." required></textarea>
              </div>

              <button type="submit" class="btn btn-premium w-100 py-3 fw-bold fs-5">
                <i class="bi bi-send me-2"></i>SEND MESSAGE
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </section>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/stage6.js"></script>
</body>
</html>
