<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>My Profile | BidURS</title>
  <meta name="description" content="Manage your BidURS profile, contact details, and account preferences.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-dashboard-page="profile">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../assets/images/favicon.png" alt="BIDURS Logo">
        BIDURS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto"></ul>
        <div class="d-flex gap-2"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4">
      <div class="col-lg-3" id="dashboard-sidebar"></div>

      <div class="col-lg-9">
        <div class="mb-4">
          <h2 class="fw-bold text-white mb-0" style="font-family:var(--font-heading);">Profile <span style="background:var(--grad-orange);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Information</span></h2>
          <p style="color:var(--blue-gray);" class="mt-1">Manage your personal details and account preferences.</p>
        </div>

        <div class="glass p-4 p-md-5" style="border-radius:var(--radius-lg);">
          <!-- Profile Header -->
          <div class="d-flex align-items-center gap-4 mb-5 pb-4" style="border-bottom:1px solid var(--glass-border);">
            <div style="width:80px;height:80px;background:var(--grad-orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:white;font-family:var(--font-heading);box-shadow:var(--glow-orange);flex-shrink:0;">JD</div>
            <div>
              <h4 class="fw-bold text-white mb-0" style="font-family:var(--font-heading);">John Doe</h4>
              <p class="mb-1" style="color:var(--blue-gray);font-size:0.88rem;">ID: ER-2456</p>
              <span class="badge" style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.35);color:#86efac;font-size:0.76rem;">Active Member</span>
            </div>
          </div>

          <form onsubmit="event.preventDefault(); alert('Profile saved! (Demo only)');">
            <div class="profile-section-title">Personal Information</div>
            <div class="row g-4 mb-5">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" value="John Doe">
              </div>
              <div class="col-md-6">
                <label class="form-label">User ID</label>
                <input type="text" class="form-control" value="ER-2456" disabled style="opacity:0.6;">
              </div>
              <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" value="johndoe@example.com">
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" value="9876543210">
              </div>
            </div>

            <div class="profile-section-title">Change Password</div>
            <div class="row g-4 mb-5">
              <div class="col-md-6">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" placeholder="Enter current password">
              </div>
              <div class="col-md-6">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" placeholder="Enter new password">
              </div>
            </div>

            <div class="d-flex gap-3 pt-3" style="border-top:1px solid var(--glass-border);">
              <button type="submit" class="btn btn-premium px-5">
                <i class="bi bi-save me-2"></i>Save Changes
              </button>
              <button type="button" class="btn btn-glass px-4">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
