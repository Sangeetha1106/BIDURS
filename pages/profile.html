<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>My Profile | BIDURS</title>
  <meta name="description" content="Manage your BIDURS profile, contact details, and account preferences.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-dashboard-page="profile">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../images/logo1.png" alt="BIDURS Logo">
        BIDURS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto"></ul>
        <div class="d-flex gap-2"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4">
      <div class="col-lg-3" id="dashboard-sidebar"></div>

      <div class="col-lg-9">
        <div class="mb-4">
          <h2 class="fw-bold text-navy mb-0" style="font-family:var(--font-heading);">Profile <span style="background:var(--grad-orange);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Information</span></h2>
          <p class="text-secondary fw-medium mt-1">Manage your personal details and account preferences.</p>
        </div>

        <div class="glass p-4 p-md-5" style="border-radius:var(--radius-lg);">
          <!-- Profile Header -->
          <div class="d-flex align-items-center gap-4 mb-5 pb-4" style="border-bottom:1px solid var(--glass-border);">
            <div id="prof-avatar" style="width:80px;height:80px;background:var(--grad-orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:white;font-family:var(--font-heading);box-shadow:var(--glow-orange);flex-shrink:0;">CU</div>
            <div>
              <h4 class="fw-bold text-navy mb-0" id="prof-header-name" style="font-family:var(--font-heading);">Customer</h4>
              <p class="mb-1 font-monospace" style="color:var(--gold);font-size:0.88rem;" id="prof-header-id">ID: CUST-2456</p>
              <span class="badge" style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.35);color:#86efac;font-size:0.76rem;">Customer Account</span>
            </div>
          </div>

          <form onsubmit="event.preventDefault(); alert('Profile saved successfully! (Demo flow)');">
            <div class="profile-section-title">Personal Information</div>
            <div class="row g-4 mb-5">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="prof-input-name" value="Customer">
              </div>
              <div class="col-md-6">
                <label class="form-label">Customer Login ID</label>
                <input type="text" class="form-control font-monospace" id="prof-input-id" value="CUST-2456" disabled style="opacity:0.75;background:rgba(255,255,255,0.05);color:var(--gold);">
              </div>
              <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="prof-input-email" value="customer@bidurs.in">
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="prof-input-mobile" value="9876543210">
              </div>
            </div>

            <div class="profile-section-title">Change Password</div>
            <div class="row g-4 mb-5">
              <div class="col-md-6">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" placeholder="Enter current password">
              </div>
              <div class="col-md-6">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" placeholder="Enter new password">
              </div>
            </div>

            <div class="d-flex gap-3 pt-3" style="border-top:1px solid var(--glass-border);">
              <button type="submit" class="btn btn-premium px-5">
                <i class="bi bi-save me-2"></i>Save Changes
              </button>
              <button type="button" class="btn btn-glass px-4" onclick="window.history.back()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('userName') || 'Customer';
      const id = localStorage.getItem('userId') || 'CUST-2456';
      const email = localStorage.getItem('userEmail') || 'customer@bidurs.in';
      const initials = name.split(' ').filter(Boolean).map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'CU';

      document.getElementById('prof-avatar').textContent = initials;
      document.getElementById('prof-header-name').textContent = name;
      document.getElementById('prof-header-id').textContent = 'ID: ' + id;
      document.getElementById('prof-input-name').value = name;
      document.getElementById('prof-input-id').value = id;
      document.getElementById('prof-input-email').value = email;
    });
  </script>
</body>
</html>
