<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | PICKURS.in</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light" data-dashboard-page="profile">

  <nav class="navbar navbar-expand-lg sticky-top bg-white">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">PICKURS<span>.in</span></a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto"></ul>
        <div class="d-flex gap-2 ms-auto"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4">
      <!-- Sidebar -->
      <div class="col-lg-3" id="dashboard-sidebar"></div>
      
      <!-- Main Content -->
      <div class="col-lg-9">
        <div class="mb-4">
          <h2 class="fw-bold text-navy mb-0">Profile Information</h2>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4 p-md-5">
            <form onsubmit="event.preventDefault(); alert('Profile saved! (Demo only)');">
              <div class="row g-4">
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">FULL NAME</label>
                  <input type="text" class="form-control" value="John Doe">
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">USER ID</label>
                  <input type="text" class="form-control" value="PK-2456" disabled>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                  <input type="email" class="form-control" value="johndoe@example.com">
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">MOBILE NUMBER</label>
                  <input type="tel" class="form-control" value="9876543210">
                </div>
                <div class="col-12 mt-4 pt-3 border-top">
                  <button type="submit" class="btn btn-premium px-5">SAVE CHANGES</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <div id="global-footer"></div>
</body>
</html>
