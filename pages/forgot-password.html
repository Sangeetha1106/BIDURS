<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>Forgot Password | BIDURS</title>
  <meta name="description" content="Reset your BIDURS account password securely.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../images/logo1.png" alt="BIDURS Logo">
        BIDURS
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

          <!-- Reset Form Card -->
          <div class="auth-card animate-fade-up" id="resetCard">
            <div class="auth-card-header">
              <div style="width:64px;height:64px;background:rgba(255,255,255,0.15);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;border:1px solid rgba(255,255,255,0.25);">
                <i class="bi bi-key-fill" style="font-size:1.75rem;color:white;"></i>
              </div>
              <h2 class="text-white fw-bold mb-1" style="font-family:var(--font-heading);">Reset Password</h2>
              <p class="mb-0" style="color:rgba(255,255,255,0.6);font-size:0.9rem;">We'll send you a reset link</p>
            </div>
            <div class="auth-card-body">
              <form id="forgotForm" onsubmit="handleReset(event)">
                <div id="forgotError" class="alert alert-danger d-none small fw-bold mb-4"></div>
                <div class="mb-4">
                  <label class="form-label">Email or Mobile Number</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="text" class="form-control" id="emailInput" placeholder="your@email.com or 9876543210">
                  </div>
                </div>
                <button type="submit" class="btn btn-premium w-100 py-3 fw-bold fs-5">
                  <i class="bi bi-send me-2"></i>SEND RESET LINK
                </button>
              </form>
              <div class="text-center mt-4 pt-3" style="border-top:1px solid var(--glass-border);">
                <a href="login.html" class="text-decoration-none" style="color:var(--bright-blue);font-size:0.9rem;">
                  <i class="bi bi-arrow-left me-1"></i>Back to Login
                </a>
              </div>
            </div>
          </div>

          <!-- Success Card -->
          <div class="auth-card animate-fade-up d-none" id="successCard">
            <div class="auth-card-body text-center py-5">
              <div style="width:90px;height:90px;background:rgba(34,197,94,0.12);border:2px solid rgba(34,197,94,0.4);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1.5rem;">
                <i class="bi bi-envelope-check-fill" style="font-size:2.5rem;color:var(--success);"></i>
              </div>
              <h3 class="fw-bold text-white mb-3" style="font-family:var(--font-heading);">Check your inbox!</h3>
              <p style="color:var(--blue-gray-lt);" class="mb-4">Password reset instructions have been sent to your provided email or mobile number.</p>
              <a href="login.html" class="btn btn-premium w-100 fw-bold py-3">RETURN TO LOGIN</a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const errorDiv = document.getElementById('forgotError');
      if (!email) {
        errorDiv.textContent = 'Please enter your email or mobile number.';
        errorDiv.classList.remove('d-none'); return;
      }
      document.getElementById('resetCard').classList.add('d-none');
      document.getElementById('successCard').classList.remove('d-none');
    }
  </script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
