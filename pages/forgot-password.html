<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | PICKURS.in</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">PICKURS<span>.in</span></a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden" id="resetCard">
          <div class="bg-navy p-4 text-center">
            <h2 class="text-white fw-bold mb-0">Reset Password</h2>
            <p class="text-white-50 mb-0">We will send you a reset link</p>
          </div>
          <div class="card-body p-4 p-md-5">
            <form id="forgotForm" onsubmit="handleReset(event)">
              <div id="forgotError" class="alert alert-danger d-none small fw-bold"></div>
              
              <div class="form-floating mb-4">
                <input type="text" class="form-control" id="emailInput" placeholder="name@example.com">
                <label for="emailInput">Email or Mobile Number</label>
              </div>

              <button type="submit" class="btn btn-premium w-100 py-3 fw-bold fs-5 shadow-sm">SEND RESET LINK</button>
            </form>
            <div class="text-center mt-4">
              <a href="login.html" class="text-navy fw-bold text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden d-none" id="successCard">
           <div class="card-body p-5 text-center">
             <i class="bi bi-envelope-check-fill text-success display-1 mb-3"></i>
             <h3 class="fw-bold text-navy mb-3">Check your inbox</h3>
             <p class="text-muted mb-4">Password reset instructions have been sent to your provided email or mobile number.</p>
             <a href="login.html" class="btn btn-premium w-100 fw-bold">RETURN TO LOGIN</a>
           </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const errorDiv = document.getElementById('forgotError');
      
      if (!email) {
        errorDiv.textContent = "Please enter your email or mobile number.";
        errorDiv.classList.remove('d-none');
        return;
      }
      
      // Frontend demo success state
      document.getElementById('resetCard').classList.add('d-none');
      document.getElementById('successCard').classList.remove('d-none');
    }
  </script>
  <div id="global-footer"></div>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
