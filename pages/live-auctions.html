<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Auctions | PICKURS.in</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page-type="live">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">PICKURS<span>.in</span></a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-toggle="target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">All Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="live-auctions.html">Live Auctions</a></li>
          <li class="nav-item"><a class="nav-link" href="upcoming-auctions.html">Upcoming</a></li>
        </ul>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-premium">Login</button>
          <button class="btn btn-premium">Register</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="bg-danger bg-gradient py-5 text-white">
    <div class="container text-center">
      <h1 class="fw-bold mb-3"><i class="bi bi-broadcast"></i> Live Auctions</h1>
      <p class="lead text-white-50">Bid in real-time. Highest bidder when the timer ends wins!</p>
    </div>
  </div>

  <div class="container py-5">
    <div class="row g-4 mb-5 justify-content-center">
       <div class="col-md-8 col-lg-6">
          <div class="input-group input-group-lg shadow-sm">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="search-input" class="form-control border-start-0 border-end-0" placeholder="Search live auctions...">
            <select id="category-filter" class="form-select border-start-0" style="max-width: 150px;">
              <option value="All">All Categories</option>
              <option value="Mobiles">Mobiles</option>
              <option value="Laptops">Laptops</option>
              <option value="Electronics">Electronics</option>
            </select>
          </div>
       </div>
       <div class="col-md-4 col-lg-3">
          <select id="sort-filter" class="form-select form-select-lg shadow-sm">
            <option value="Ending Soon">Sort: Ending Soon</option>
            <option value="Lowest Current Bid">Sort: Lowest Bid</option>
            <option value="Highest Current Bid">Sort: Highest Bid</option>
          </select>
       </div>
    </div>
    
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold" id="product-count">Loading...</h4>
    </div>
    <div class="row" id="products-grid">
      <!-- Rendered via JS -->
    </div>
  </div>

  <!-- Footer -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/data/products.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/timer.js"></script>
  <script src="../assets/js/filters.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
