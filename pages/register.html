<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>Register | BIDURS</title>
  <meta name="description" content="Create your BIDURS account and start participating in live auctions for premium products.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../images/logo2.png" alt="BIDURS Logo">
        BIDURS<span>.COM</span>
      </a>
      <div class="d-flex gap-2 ms-auto">
        <a href="login.html" class="btn btn-outline-premium">Login</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="auth-card animate-fade-up">

            <div class="auth-card-header">
              <div style="width:64px;height:64px;background:rgba(255,255,255,0.15);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;border:1px solid rgba(255,255,255,0.25);">
                <i class="bi bi-person-plus-fill" style="font-size:1.75rem;color:white;"></i>
              </div>
              <h2 class="text-white fw-bold mb-1" style="font-family:var(--font-heading);">Create an Account</h2>
              <p class="mb-0" style="color:rgba(255,255,255,0.6);font-size:0.9rem;">Join India's premium e-auction platform</p>
            </div>

            <div class="auth-card-body">
              <form id="registerForm" onsubmit="handleRegister(event)">
                <div id="registerError" class="alert alert-danger d-none small fw-bold mb-4"></div>

                <div class="mb-3">
                  <label class="form-label">Full Name</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="nameInput" placeholder="John Doe">
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                      <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-phone"></i></span>
                      <input type="tel" class="form-control" id="mobileInput" placeholder="9876543210">
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Date of Birth <span class="badge bg-warning text-dark ms-1">18+ Required</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                    <input type="date" class="form-control" id="dobInput" onchange="checkAgeFeedback(this.value)">
                  </div>
                  <div id="ageFeedback" class="form-text small mt-1"></div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-5">
                    <label class="form-label">Age / ID Proof Type</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                      <select class="form-select" id="idTypeSelect">
                        <option value="">Select Proof</option>
                        <option value="Aadhaar Card">Aadhaar Card</option>
                        <option value="PAN Card">PAN Card</option>
                        <option value="Driving License">Driving License</option>
                        <option value="Voter ID">Voter ID</option>
                        <option value="Passport">Passport</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-7">
                    <label class="form-label">Upload Proof Document</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-file-earmark-arrow-up text-primary"></i></span>
                      <input type="file" class="form-control" id="idProofFileInput" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="checkFileUploadFeedback(this)">
                    </div>
                    <div id="fileUploadFeedback" class="form-text small mt-1 text-white-50">Upload PDF, DOC, DOCX, JPG or PNG (Max 10MB)</div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Enter your password" oninput="validatePasswordInput(this.value)">
                    <span class="input-group-text" onclick="togglePasswordVisibility('passwordInput', this)" style="cursor:pointer;" title="Toggle Password Visibility">
                      <i class="bi bi-eye"></i>
                    </span>
                  </div>
                  <div id="passwordFeedback" class="form-text small mt-1"></div>
                </div>

                <div class="mb-4">
                  <label class="form-label">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Repeat your password" oninput="validateConfirmPassword(this.value)">
                    <span class="input-group-text" onclick="togglePasswordVisibility('confirmPasswordInput', this)" style="cursor:pointer;" title="Toggle Password Visibility">
                      <i class="bi bi-eye"></i>
                    </span>
                  </div>
                  <div id="confirmPasswordFeedback" class="form-text small mt-1"></div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="termsCheck">
                  <label class="form-check-label small text-white" for="termsCheck">
                    I confirm that I am <strong>18 years or older</strong> and accept the <a href="terms.html" target="_blank" style="color:var(--orange);">Terms &amp; Conditions</a> and <a href="#" style="color:var(--orange);">Privacy Policy</a>.
                  </label>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 fw-bold fs-5">
                  <i class="bi bi-person-check me-2"></i>CREATE ACCOUNT
                </button>
              </form>

              <div class="text-center mt-4 pt-3" style="border-top:1px solid var(--glass-border);">
                <span style="color:var(--blue-gray);font-size:0.88rem;">Already have an account? </span>
                <a href="login.html" class="fw-bold text-decoration-none" style="color:var(--orange);">LOGIN</a>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dobInput = document.getElementById('dobInput');
      if (dobInput) {
        // Set max date to today
        const todayStr = new Date().toISOString().split('T')[0];
        dobInput.setAttribute('max', todayStr);
      }
    });

    function calculateAge(dobString) {
      if (!dobString) return 0;
      const today = new Date();
      const birthDate = new Date(dobString);
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }
      return age;
    }

    function checkAgeFeedback(dobVal) {
      const feedback = document.getElementById('ageFeedback');
      if (!dobVal) {
        feedback.innerHTML = '';
        return;
      }
      const age = calculateAge(dobVal);
      if (age < 18) {
        feedback.className = 'form-text small mt-1 text-danger fw-bold';
        feedback.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i> You are ${age} years old. Minimum age required to register is 18 years.`;
      } else {
        feedback.className = 'form-text small mt-1 text-success fw-bold';
        feedback.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Verified: Age is ${age} years (Eligible).`;
      }
    }

    function checkFileUploadFeedback(input) {
      const feedback = document.getElementById('fileUploadFeedback');
      if (!feedback) return;
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        if (file.size > 10 * 1024 * 1024) {
          feedback.className = 'form-text small mt-1 text-danger fw-bold';
          feedback.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-1"></i> File exceeds 10MB limit (${sizeMB} MB). Please select a smaller file.`;
          input.value = '';
        } else {
          feedback.className = 'form-text small mt-1 text-success fw-bold';
          feedback.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Selected Document: <strong>${file.name}</strong> (${sizeMB} MB)`;
        }
      } else {
        feedback.className = 'form-text small mt-1 text-white-50';
        feedback.textContent = 'Upload PDF, DOC, DOCX, JPG or PNG (Max 10MB)';
      }
    }

    function validatePasswordInput(val) {
      const feedback = document.getElementById('passwordFeedback');
      if (!feedback) return;

      if (!val) {
        feedback.innerHTML = '';
        return;
      }

      const missing = [];
      if (val.length < 8) {
        missing.push('Minimum 8 characters compulsory');
      }
      if (!/[A-Z]/.test(val)) {
        missing.push('1 Capital letter (A-Z) compulsory');
      }
      if (!/[0-9]/.test(val)) {
        missing.push('1 Number (0-9) compulsory');
      }
      if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val)) {
        missing.push('1 Symbol (@, #, $, etc.) compulsory');
      }

      if (missing.length > 0) {
        feedback.className = 'form-text small mt-1 text-danger fw-bold';
        feedback.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i> ${missing.join(' | ')}`;
      } else {
        feedback.className = 'form-text small mt-1 text-success fw-bold';
        feedback.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Strong & valid password!`;
      }

      const confirmVal = document.getElementById('confirmPasswordInput')?.value;
      if (confirmVal) {
        validateConfirmPassword(confirmVal);
      }
    }

    function validateConfirmPassword(val) {
      const feedback = document.getElementById('confirmPasswordFeedback');
      const pass = document.getElementById('passwordInput')?.value;
      if (!feedback) return;

      if (!val) {
        feedback.innerHTML = '';
        return;
      }

      if (pass && val === pass) {
        feedback.className = 'form-text small mt-1 text-success fw-bold';
        feedback.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Passwords match!`;
      } else {
        feedback.className = 'form-text small mt-1 text-danger fw-bold';
        feedback.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i> Passwords do not match!`;
      }
    }

    function togglePasswordVisibility(inputId, triggerEl) {
      const input = document.getElementById(inputId);
      const icon = triggerEl.querySelector ? (triggerEl.querySelector('i') || triggerEl) : triggerEl;
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash text-primary';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye text-navy';
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const mobile = document.getElementById('mobileInput').value.trim();
      const dob = document.getElementById('dobInput').value;
      const idType = document.getElementById('idTypeSelect').value;
      const fileInput = document.getElementById('idProofFileInput');
      const uploadedFile = fileInput.files && fileInput.files[0];
      const pass = document.getElementById('passwordInput').value;
      const confirmPass = document.getElementById('confirmPasswordInput').value;
      const terms = document.getElementById('termsCheck').checked;
      const errorDiv = document.getElementById('registerError');

      if (!name || !email || !mobile || !dob || !idType || !uploadedFile || !pass || !confirmPass) {
        errorDiv.textContent = 'Please fill out all required fields, select Proof Type, and upload your ID proof document.';
        errorDiv.classList.remove('d-none'); return;
      }

      const age = calculateAge(dob);
      if (age < 18) {
        errorDiv.textContent = `Registration Rejected: You are ${age} years old. You must be at least 18 years old to create an account.`;
        errorDiv.classList.remove('d-none'); return;
      }

      // Strict Password Validation: Min 8 chars, 1 Capital Letter, 1 Number, 1 Symbol
      const hasLength = pass.length >= 8;
      const hasCapital = /[A-Z]/.test(pass);
      const hasNumber = /[0-9]/.test(pass);
      const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass);

      if (!hasLength || !hasCapital || !hasNumber || !hasSymbol) {
        let missing = [];
        if (!hasLength) missing.push('min 8 characters');
        if (!hasCapital) missing.push('at least 1 capital letter (A-Z)');
        if (!hasNumber) missing.push('at least 1 number (0-9)');
        if (!hasSymbol) missing.push('at least 1 special symbol (@, #, $, etc.)');

        errorDiv.textContent = `Password Requirement Failed: Password must contain ${missing.join(', ')}.`;
        errorDiv.classList.remove('d-none'); return;
      }

      if (pass !== confirmPass) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.classList.remove('d-none'); return;
      }
      if (!terms) {
        errorDiv.textContent = 'You must confirm that you are 18+ and accept the Terms & Conditions.';
        errorDiv.classList.remove('d-none'); return;
      }

      errorDiv.classList.add('d-none');

      // Generate a unique Login ID for new customer
      const generatedUserId = 'CUST-' + Math.floor(1000 + Math.random() * 9000);
      const pendingUser = {
        name: name,
        email: email,
        mobile: mobile,
        dob: dob,
        age: age,
        idType: idType,
        idFileName: uploadedFile.name,
        idFileSize: (uploadedFile.size / 1024).toFixed(1) + ' KB',
        userId: generatedUserId
      };
      localStorage.setItem('pendingUser', JSON.stringify(pendingUser));
      window.location.href = 'otp-verification.html';
    }
  </script>
</body>
</html>
