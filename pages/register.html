<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>Register | BIDURS</title>
  <meta name="description" content="Create your BIDURS account and start participating in live auctions for premium products.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../assets/images/favicon.png" alt="BIDURS Logo">
        BIDURS
      </a>
      <div class="d-flex gap-2 ms-auto">
        <a href="login.html" class="btn btn-outline-premium">Login</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="auth-card animate-fade-up">

            <div class="auth-card-header">
              <div style="width:64px;height:64px;background:rgba(255,255,255,0.15);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;border:1px solid rgba(255,255,255,0.25);">
                <i class="bi bi-person-plus-fill" style="font-size:1.75rem;color:white;"></i>
              </div>
              <h2 class="text-white fw-bold mb-1" style="font-family:var(--font-heading);">Create an Account</h2>
              <p class="mb-0" style="color:rgba(255,255,255,0.6);font-size:0.9rem;">Join India's premium e-auction platform</p>
            </div>

            <div class="auth-card-body">
              <form id="registerForm" onsubmit="handleRegister(event)">
                <div id="registerError" class="alert alert-danger d-none small fw-bold mb-4"></div>

                <div class="mb-3">
                  <label class="form-label">Full Name</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="nameInput" placeholder="John Doe">
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                      <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-phone"></i></span>
                      <input type="tel" class="form-control" id="mobileInput" placeholder="9876543210">
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Password (Min 8 characters)</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Create a strong password">
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Repeat your password">
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="termsCheck">
                  <label class="form-check-label small" for="termsCheck">
                    I accept the <a href="#" style="color:var(--orange);">Terms &amp; Conditions</a> and <a href="#" style="color:var(--orange);">Privacy Policy</a>
                  </label>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 fw-bold fs-5">
                  <i class="bi bi-person-check me-2"></i>CREATE ACCOUNT
                </button>
              </form>

              <div class="text-center mt-4 pt-3" style="border-top:1px solid var(--glass-border);">
                <span style="color:var(--blue-gray);font-size:0.88rem;">Already have an account? </span>
                <a href="login.html" class="fw-bold text-decoration-none" style="color:var(--orange);">LOGIN</a>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('nameInput').value;
      const email = document.getElementById('emailInput').value;
      const mobile = document.getElementById('mobileInput').value;
      const pass = document.getElementById('passwordInput').value;
      const confirmPass = document.getElementById('confirmPasswordInput').value;
      const terms = document.getElementById('termsCheck').checked;
      const errorDiv = document.getElementById('registerError');
      if (!name || !email || !mobile || !pass || !confirmPass) {
        errorDiv.textContent = 'Please fill out all required fields.';
        errorDiv.classList.remove('d-none'); return;
      }
      if (pass.length < 8) {
        errorDiv.textContent = 'Password must be at least 8 characters long.';
        errorDiv.classList.remove('d-none'); return;
      }
      if (pass !== confirmPass) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.classList.remove('d-none'); return;
      }
      if (!terms) {
        errorDiv.textContent = 'You must accept the Terms & Conditions.';
        errorDiv.classList.remove('d-none'); return;
      }
      errorDiv.classList.add('d-none');
      window.location.href = 'otp-verification.html';
    }
  </script>
</body>
</html>
