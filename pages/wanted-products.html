<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>Wanted Products | BIDURS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-dark">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../images/logo2.png" alt="BIDURS Logo">
        BIDURS<span>.COM</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto"></ul>
        <div class="d-flex gap-2 ms-auto"></div>
      </div>
    </div>
  </nav>

  <div class="hero-section py-5 text-white border-bottom">
    <div class="container position-relative z-1">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
          <h1 class="hero-title mb-1">Wanted <gold>Products</gold></h1>
          <p class="hero-subtitle mb-0">Browse items requested by our community or post your own.</p>
        </div>
        <button class="btn btn-premium btn-lg shadow-sm" data-bs-toggle="modal" data-bs-target="#wantedModal">
          <i class="bi bi-plus-lg me-2"></i> Post Request
        </button>
      </div>
    </div>
  </div>

  <div class="container py-5">
    <!-- Wanted Products 6 Category Cards -->
    <div class="row g-3 mb-4" id="wp-category-cards-container"></div>

    <div class="filter-sidebar row mb-4 g-3 p-3 rounded-4 shadow-sm align-items-center">
      <div class="col-lg-3 col-md-6">
        <input type="text" id="wp-search-input" class="form-control" placeholder="Search wanted products...">
      </div>
      <div class="col-lg-2 col-md-6">
        <select id="wp-category-filter" class="form-select">
          <option value="All Categories">All Categories</option>
          <option value="Mobiles">Mobiles</option>
          <option value="Laptops">Laptops</option>
          <option value="Electronics">Electronics</option>
          <option value="Gaming">Gaming</option>
          <option value="Wearables">Wearables</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
      <div class="col-lg-2 col-md-6">
        <select id="wp-status-filter" class="form-select">
          <option value="All Statuses">All Statuses</option>
          <option value="Open">Open</option>
          <option value="Matched">Matched</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
      <div class="col-lg-2 col-md-6">
        <select id="wp-sort-filter" class="form-select">
          <option value="Newest First">Newest First</option>
          <option value="Oldest First">Oldest First</option>
          <option value="Lowest Budget">Lowest Budget</option>
          <option value="Highest Budget">Highest Budget</option>
        </select>
      </div>
      <div class="col-lg-3 col-md-12 d-flex gap-2">
        <button id="wp-filter-btn" class="btn btn-royal flex-fill">Filter</button>
        <button id="wp-clear-btn" class="btn btn-outline-premium flex-fill">Clear</button>
      </div>
    </div>

    <!-- Active Category Filter Badge -->
    <div id="active-category-badge" class="mb-4 d-none">
      <div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-pill" style="background:rgba(11,27,61,0.9); border: 1px solid var(--gold);">
        <span class="text-white small fw-semibold"><i class="bi bi-funnel-fill text-gold me-1"></i> Active Category:</span>
        <span id="selected-category-name" class="badge bg-warning text-dark fw-bold px-3 py-1 fs-6"></span>
        <button id="clear-category-badge-btn" class="btn-close btn-close-white ms-2" style="font-size:0.65rem;" title="Show All Categories"></button>
      </div>
    </div>

    <!-- Wanted Products List rendered by stage6.js / wanted-products.js -->
    <div class="row g-4" id="wanted-list-container"></div>
  </div>

  <!-- Post Request Modal -->
  <div class="modal fade" id="wantedModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header bg-navy text-white border-0 py-3">
          <h5 class="modal-title fw-bold">Post a Wanted Product</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 p-md-5">
          <form id="wanted-form">
            <div class="row g-4">
              <div class="col-md-8">
                <label class="form-label text-muted small fw-bold">PRODUCT TITLE</label>
                <input type="text" class="form-control" id="wp-title" required placeholder="e.g., iPhone 15 Pro Max 256GB">
              </div>
              <div class="col-md-4">
                <label class="form-label text-muted small fw-bold">CATEGORY</label>
                <select class="form-select" id="wp-category" required>
                  <option value="Mobiles">Mobiles</option>
                  <option value="Laptops">Laptops</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Gaming">Gaming</option>
                  <option value="Wearables">Wearables</option>
                  <option value="Accessories">Accessories</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">MAX BUDGET (₹)</label>
                <input type="number" class="form-control" id="wp-budget" required placeholder="e.g., 95000">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">PREFERRED CONDITION</label>
                <select class="form-select" id="wp-condition">
                  <option>Brand New (Sealed)</option>
                  <option>Like New</option>
                  <option>Used - Good</option>
                  <option>Any</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label text-muted small fw-bold">DESCRIPTION</label>
                <textarea class="form-control" id="wp-desc" rows="3" required placeholder="Include specific colors, storage sizes, or specs required."></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">LOCATION</label>
                <input type="text" class="form-control" placeholder="City, State" required>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">CONTACT PREFERENCE</label>
                <select class="form-select">
                  <option>In-App Chat Only</option>
                  <option>Email</option>
                  <option>Phone Call</option>
                </select>
              </div>
              <div class="col-12 mt-4 pt-3 border-top text-end">
                <button type="button" class="btn btn-light px-4 me-2" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-premium px-5">Submit Request</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js?v=2"></script>
  <script src="../assets/data/wanted-products.js?v=2"></script>
  <script src="../assets/js/stage6.js?v=2"></script>
  <script src="../assets/js/wanted-products.js?v=2"></script>
</body>
</html>
