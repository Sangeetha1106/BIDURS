<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products | BIDURS</title>
  <meta name="description" content="Explore all premium products available for auction on BIDURS. Filter by category, status, and find the best deals.">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page-type="all">

  <!-- ══ NAVBAR ══ -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../images/logo1.png" alt="BIDURS Logo">
        BIDURS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto"></ul>
        <div class="d-flex gap-2"></div>
      </div>
    </div>
  </nav>

  <!-- ══ PAGE HERO ══ -->
  <div class="page-hero">
    <div class="container text-center position-relative z-1">
      <span class="badge rounded-pill px-3 py-2 mb-3 fw-bold" style="background:rgba(59,130,246,0.2);border:1px solid rgba(59,130,246,0.4);color:var(--light-blue);font-size:0.8rem;">
        <i class="bi bi-grid me-1"></i> Full Catalogue
      </span>
      <h1 class="hero-title mb-3">Explore All <span>Products</span></h1>
      <p class="hero-subtitle mx-auto" style="font-size:1rem;">Find the best deals on premium electronics and lifestyle products.</p>
    </div>
  </div>

  <div class="container py-5">
    <div class="row g-4">

      <!-- ══ SIDEBAR FILTERS ══ -->
      <div class="col-lg-3">
        <div class="filter-sidebar p-4 sticky-top" style="top:90px;">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0 fw-bold"><i class="bi bi-sliders me-2"></i>Filters</h5>
            <button class="btn btn-sm btn-glass px-3 py-1" id="clear-filters-btn" style="font-size:0.8rem;">Clear All</button>
          </div>

          <!-- Search -->
          <div class="mb-4">
            <label class="form-label">Search</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="search-input" class="form-control" placeholder="Product name or brand...">
            </div>
          </div>

          <!-- Category -->
          <div class="mb-4">
            <label class="form-label">Category</label>
            <select id="category-filter" class="form-select">
              <option value="All">All Categories</option>
              <option value="Mobiles">Mobiles</option>
              <option value="Laptops">Laptops</option>
              <option value="Tablets">Tablets</option>
              <option value="Cameras">Cameras</option>
              <option value="Electronics">Electronics</option>
              <option value="Accessories">Accessories</option>
              <option value="Smart Devices">Smart Devices</option>
            </select>
          </div>

          <!-- Status -->
          <div class="mb-4">
            <label class="form-label">Auction Status</label>
            <select id="status-filter" class="form-select">
              <option value="All">All Statuses</option>
              <option value="LIVE">Live Auctions</option>
              <option value="ENDING SOON">Ending Soon</option>
              <option value="UPCOMING">Upcoming Auctions</option>
              <option value="ENDED">Ended Auctions</option>
            </select>
          </div>

          <!-- Sort -->
          <div class="mb-3">
            <label class="form-label">Sort By</label>
            <select id="sort-filter" class="form-select">
              <option value="Newest">Newest First</option>
              <option value="Ending Soon">Ending Soon</option>
              <option value="Lowest Market Price">Lowest Market Price</option>
              <option value="Highest Market Price">Highest Market Price</option>
            </select>
          </div>

          <!-- Best Deals Box -->
          <div class="mt-4 p-3 rounded-3" style="background:linear-gradient(135deg,rgba(249,115,22,0.15),rgba(59,130,246,0.1));border:1px solid rgba(249,115,22,0.3);">
            <div class="d-flex align-items-center gap-2 mb-2">
              <i class="bi bi-fire" style="color:var(--orange);font-size:1.2rem;"></i>
              <span class="fw-bold text-white" style="font-size:0.9rem;">Best Deals</span>
            </div>
            <p class="mb-2" style="font-size:0.78rem;color:var(--blue-gray);">Limited Time Auctions — Act fast before they end!</p>
            <a href="live-auctions.html" class="btn btn-premium btn-sm w-100">View All →</a>
          </div>
        </div>
      </div>

      <!-- ══ PRODUCT GRID ══ -->
      <div class="col-lg-9">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3" style="border-bottom:1px solid var(--glass-border);">
          <div>
            <h3 class="fw-bold text-navy mb-1">All <gold>Products</gold></h3>
            <p class="mb-0 text-secondary font-semibold" style="font-size:0.88rem;">Discover amazing products and bid for the best deals.</p>
          </div>
          <div class="d-flex align-items-center gap-3 mt-3 mt-md-0">
            <span class="fw-medium text-nowrap" id="product-count" style="color:var(--blue-gray);font-size:0.88rem;"></span>
            <select id="sort-filter-right" class="form-select form-select-sm" style="width:auto;min-width:170px;">
              <option value="Newest">Newest First</option>
              <option value="Ending Soon">Ending Soon</option>
              <option value="Lowest Market Price">Lowest Market Price</option>
              <option value="Highest Market Price">Highest Market Price</option>
            </select>
          </div>
        </div>
        <div class="row g-4" id="products-grid">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/data/products.js"></script>
  <script src="../assets/data/auction-schedule.js"></script>
  <script src="../assets/js/auction-engine.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/timer.js"></script>
  <script src="../assets/js/filters.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
