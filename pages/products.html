<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products | PICKURS.in</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page-type="all">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">PICKURS<span>.in</span></a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-toggle="target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html">All Products</a></li>
          <li class="nav-item"><a class="nav-link" href="live-auctions.html">Live Auctions</a></li>
          <li class="nav-item"><a class="nav-link" href="upcoming-auctions.html">Upcoming</a></li>
        </ul>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-premium">Login</button>
          <button class="btn btn-premium">Register</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="bg-navy py-5 text-white">
    <div class="container text-center">
      <h1 class="fw-bold mb-3">Explore All Products</h1>
      <p class="lead text-white-50">Find the best deals on premium electronics and lifestyle products.</p>
    </div>
  </div>

  <div class="container py-5">
    <div class="row g-4">
      <!-- Sidebar Filters -->
      <div class="col-lg-3">
        <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0 fw-bold">Filters</h5>
            <button class="btn btn-sm btn-link text-muted text-decoration-none p-0" id="clear-filters-btn">Clear All</button>
          </div>
          
          <!-- Search -->
          <div class="mb-4">
            <label class="form-label small text-muted fw-bold">SEARCH</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" id="search-input" class="form-control border-start-0 ps-0" placeholder="Product name or brand...">
            </div>
          </div>
          
          <!-- Category -->
          <div class="mb-4">
            <label class="form-label small text-muted fw-bold">CATEGORY</label>
            <select id="category-filter" class="form-select">
              <option value="All">All Categories</option>
              <option value="Mobiles">Mobiles</option>
              <option value="Laptops">Laptops</option>
              <option value="Electronics">Electronics</option>
              <option value="Cameras">Cameras</option>
              <option value="Gaming">Gaming</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>

          <!-- Status -->
          <div class="mb-4">
            <label class="form-label small text-muted fw-bold">AUCTION STATUS</label>
            <select id="status-filter" class="form-select">
              <option value="All">All Statuses</option>
              <option value="LIVE">Live & Ending Soon</option>
              <option value="UPCOMING">Upcoming</option>
              <option value="ENDED">Ended</option>
            </select>
          </div>
          
          <!-- Sort -->
          <div class="mb-4">
            <label class="form-label small text-muted fw-bold">SORT BY</label>
            <select id="sort-filter" class="form-select">
              <option value="Newest">Newest First</option>
              <option value="Ending Soon">Ending Soon</option>
              <option value="Lowest Current Bid">Lowest Current Bid</option>
              <option value="Highest Current Bid">Highest Current Bid</option>
              <option value="Lowest Market Price">Lowest Market Price</option>
              <option value="Highest Market Price">Highest Market Price</option>
            </select>
          </div>

        </div>
      </div>
      
      <!-- Product Grid -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="mb-0 fw-bold" id="product-count">Loading...</h4>
        </div>
        <div class="row" id="products-grid">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Footer (Simplified for snippet) -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/data/products.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/timer.js"></script>
  <script src="../assets/js/filters.js"></script>
  <script src="../assets/js/products.js"></script>
</body>
</html>
