<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auction Result | PICKURS.in</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg sticky-top bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">PICKURS<span>.in</span></a>
      <div class="ms-auto">
        <a href="won-auctions.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container py-5" id="result-container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          <div class="bg-navy p-4 text-center text-white">
            <h2 class="fw-bold mb-0">AUCTION RESULT</h2>
            <span class="badge bg-gold text-navy mt-2 fs-6">COMPLETED</span>
          </div>
          
          <div class="card-body p-4 p-md-5 text-center">
            <div id="product-summary" class="mb-5">
              <!-- Dynamically populated if using JS, static here for layout -->
              <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=200&auto=format&fit=crop" class="rounded-3 shadow-sm mb-4" width="150">
              <h4 class="fw-bold text-navy mb-1">Apple iPhone 15 Pro Max - 256GB</h4>
              <p class="text-muted mb-0">Auction ended on: <span class="text-dark fw-semibold">05 Sep 2026, 14:30 PM</span></p>
            </div>

            <div class="row g-3 mb-5 justify-content-center">
              <div class="col-md-5">
                <div class="bg-light rounded p-4 h-100 border text-center">
                  <div class="text-muted small fw-bold text-uppercase mb-2">Winner</div>
                  <div class="fs-4 text-navy fw-bold">Bidder #2456</div>
                </div>
              </div>
              <div class="col-md-5">
                <div class="bg-light rounded p-4 h-100 border text-center border-gold">
                  <div class="text-muted small fw-bold text-uppercase mb-2">Winning Bid</div>
                  <div class="fs-2 text-gold fw-bold">₹84,500</div>
                </div>
              </div>
            </div>

            <hr class="mb-5 text-secondary">

            <div class="mb-4">
              <h5 class="fw-bold text-navy mb-3">Payment Information</h5>
              <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded border mb-3">
                <span class="fw-semibold text-muted">Status</span>
                <span class="badge bg-warning text-dark fs-6 px-3 py-2">PENDING</span>
              </div>
              <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded border">
                <span class="fw-semibold text-muted">Deadline</span>
                <span class="fw-bold text-danger font-monospace fs-5">06 Sep 2026, 14:30 PM</span>
              </div>
            </div>

            <div class="d-flex flex-column flex-md-row gap-3 mt-5">
              <a href="payment-status.html" class="btn btn-premium btn-lg w-100 fw-bold">VIEW PAYMENT STATUS</a>
              <a href="live-auctions.html" class="btn btn-outline-secondary btn-lg w-100 fw-bold">BACK TO AUCTIONS</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <div id="global-footer"></div>
</body>
</html>
