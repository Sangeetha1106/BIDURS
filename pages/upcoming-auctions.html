<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>Upcoming Auctions | BIDURS</title>
  <meta name="description" content="Set reminders for upcoming BIDURS auctions. Premium products dropping soon — be ready to bid.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page-type="upcoming">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../assets/images/favicon.png" alt="BIDURS Logo">
        BIDURS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto"></ul>
        <div class="d-flex gap-2"></div>
      </div>
    </div>
  </nav>

  <div class="page-hero">
    <div class="container text-center position-relative z-1">
      <span class="badge rounded-pill px-3 py-2 mb-3 fw-bold" style="background:rgba(59,130,246,0.2);border:1px solid rgba(59,130,246,0.4);color:var(--light-blue);font-size:0.8rem;">
        <i class="bi bi-calendar-event me-1"></i> Coming Soon
      </span>
      <h1 class="hero-title mb-3">Upcoming <span>Auctions</span></h1>
      <p class="hero-subtitle mx-auto" style="font-size:1rem;">Set a reminder for these highly anticipated products dropping soon.</p>
    </div>
  </div>

  <div class="container py-5">
    <div class="row g-3 mb-5 justify-content-center align-items-center">
      <div class="col-md-8 col-lg-7">
        <div class="input-group input-group-lg search-filter-group shadow-sm">
          <span class="input-group-text"><i class="bi bi-search fs-5"></i></span>
          <input type="text" id="search-input" class="form-control" placeholder="Search upcoming products...">
        </div>
      </div>
      <div class="col-md-4 col-lg-3">
        <select id="sort-filter" class="form-select form-select-lg sort-filter-select shadow-sm">
          <option value="Newest">Sort: Starting Soon</option>
          <option value="Lowest Market Price">Sort: Lowest Price</option>
          <option value="Highest Market Price">Sort: Highest Price</option>
        </select>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold text-navy" id="product-count" style="font-family:var(--font-heading);">Loading...</h4>
    </div>
    <div class="row g-4" id="products-grid"></div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/data/products.js"></script>
  <script src="../assets/data/auction-schedule.js"></script>
  <script src="../assets/js/auction-engine.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/timer.js"></script>
  <script src="../assets/js/filters.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
